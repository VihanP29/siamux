name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siamux
          POSTGRES_PASSWORD: siamux
          POSTGRES_DB: siamux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siamux -d siamux_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SIAMUX_DATABASE_URL: postgresql+psycopg://siamux:siamux@localhost:5432/siamux_test
      SIAMUX_TEST_DATABASE_URL: postgresql+psycopg://siamux:siamux@localhost:5432/siamux_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q
      - run: alembic downgrade base && alembic upgrade head
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py
      - run: python scripts/recovery.py
      - if: always()
        run: docker compose logs --no-color && docker compose down --volumes
