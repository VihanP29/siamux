x-app: &app
  build: .
  environment: &environment
    SIAMUX_DATABASE_URL: postgresql+psycopg://siamux:siamux@postgres:5432/siamux
    SIAMUX_BROKER_URL: redis://redis:6379/0
    SIAMUX_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: siamux
      POSTGRES_PASSWORD: siamux
      POSTGRES_DB: siamux
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siamux -d siamux"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment: *environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *app
    command: ["celery", "-A", "siamux.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
  dispatcher:
    <<: *app
    command: ["python", "-m", "siamux.dispatcher"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  postgres-data:
  redis-data:
